  <style>
    :root{
      --bg:#07000d;
      --card:#12051b;
      --card2:#1b0827;
      --pink:#ff2bbf;
      --purple:#8b35ff;
      --text:#fff;
      --muted:#b9a9c5;
      --border:rgba(255,43,191,.28);
      --shadow:0 0 28px rgba(139,53,255,.18);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(139,53,255,.22), transparent 38%),
        radial-gradient(circle at 100% 70%, rgba(255,43,191,.10), transparent 30%),
        var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      padding:20px 12px 40px;
    }

    .page{
      width:100%;
      max-width:480px;
      margin:0 auto;
    }

    .header{
      text-align:center;
      padding:8px 0 18px;
    }

    .brand{
      font-size:28px;
      font-weight:900;
      letter-spacing:2px;
      text-transform:uppercase;
      background:linear-gradient(90deg,#fff,var(--pink),#b66cff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 0 24px rgba(255,43,191,.25);
    }

    .subtitle{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    .photo-card{
      position:relative;
      overflow:hidden;
      background:linear-gradient(
        145deg,
        rgba(27,8,39,.96),
        rgba(10,2,17,.98)
      );
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:8px;
    }

    .photo-box{
      position:relative;
      overflow:hidden;
      border-radius:13px;
      background:#0b0610;
      aspect-ratio:4/5;
    }

    .photo-box img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      transition:
        transform .45s ease,
        filter .45s ease;
    }

    .photo-card:hover .photo-box img{
      transform:scale(1.035);
      filter:brightness(1.06);
    }

    .photo-glow{
      position:absolute;
      inset:auto 0 0;
      height:42%;
      background:linear-gradient(
        to top,
        rgba(4,0,8,.92),
        transparent
      );
      pointer-events:none;
    }

    .photo-info{
      padding:14px 8px 8px;
    }

    .photo-title{
      font-size:19px;
      font-weight:800;
      line-height:1.25;
    }

    .photo-desc{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      margin-top:6px;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:14px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:13px 18px;
      border-radius:12px;
      text-decoration:none;
      font-size:13px;
      font-weight:900;
      letter-spacing:.8px;
      text-transform:uppercase;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
      cursor:pointer;
    }

    .btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.08);
    }

    .btn-primary{
      color:#fff;
      background:linear-gradient(
        100deg,
        var(--purple),
        var(--pink)
      );
      box-shadow:0 8px 25px rgba(255,43,191,.24);
    }

    .smartlink-wrap{
      margin-top:12px;
    }

    .smartlink-btn{
      width:100%;
      display:block;
      text-align:center;
      padding:13px;
      border-radius:11px;
      color:#fff;
      text-decoration:none;
      font-size:12px;
      font-weight:800;
      background:linear-gradient(
        90deg,
        #641dce,
        #ff1daf
      );
      box-shadow:0 0 22px rgba(139,53,255,.18);
    }

    .native-banner{
      margin-top:16px;
      padding:12px;
      border-radius:13px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,43,191,.20);
      box-shadow:0 0 20px rgba(139,53,255,.10);
    }

    .native-title{
      margin-bottom:10px;
      color:#fff;
      font-size:13px;
      font-weight:900;
      letter-spacing:.7px;
      text-transform:uppercase;
      text-align:left;
      position:relative;
      padding-left:11px;
    }

    .native-title::before{
      content:"";
      position:absolute;
      left:0;
      top:2px;
      bottom:2px;
      width:3px;
      border-radius:4px;
      background:linear-gradient(
        180deg,
        var(--pink),
        var(--purple)
      );
      box-shadow:0 0 10px rgba(255,43,191,.65);
    }

    .native-ad{
      width:100%;
      min-height:50px;
      overflow:hidden;
      border-radius:9px;
    }

    /* HISTATS COUNTER */
    #histats_counter{
      text-align:center;
      margin-top:18px;
      min-height:1px;
    }

    .footer{
      text-align:center;
      color:#75667f;
      font-size:10px;
      margin-top:18px;
    }

    @media(max-width:360px){
      body{
        padding-left:9px;
        padding-right:9px;
      }

      .brand{
        font-size:24px;
      }

      .photo-title{
        font-size:17px;
      }
    }
  </style>
</head>
